{% extends "base.html" %}
{% block title %}{{ 'Edit' if expense else 'Add' }} Expense{% endblock %}
{% block page_title %}{{ 'Edit' if expense else 'Add' }} Expense{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
<form method="POST">
    <div class="mb-2"><label class="form-label">Date</label><input type="date" name="date" class="form-control" value="{{ default_date }}" required></div>
    <div class="mb-2"><label class="form-label">Description</label><input type="text" name="description" class="form-control" value="{{ expense.description if expense else '' }}" required></div>
    <div class="mb-2"><label class="form-label">Category</label>
        <select name="category" class="form-select">
            <option value="Rent" {{ 'selected' if expense and expense.category=='Rent' }}>Rent</option>
            <option value="Utilities" {{ 'selected' if expense and expense.category=='Utilities' }}>Utilities</option>
            <option value="Supplies" {{ 'selected' if expense and expense.category=='Supplies' }}>Supplies</option>
            <option value="Maintenance" {{ 'selected' if expense and expense.category=='Maintenance' }}>Maintenance</option>
            <option value="Payroll" {{ 'selected' if expense and expense.category=='Payroll' }}>Payroll</option>
            <option value="Marketing" {{ 'selected' if expense and expense.category=='Marketing' }}>Marketing</option>
            <option value="Equipment" {{ 'selected' if expense and expense.category=='Equipment' }}>Equipment</option>
            <option value="Other" {{ 'selected' if expense and expense.category=='Other' }}>Other</option>
        </select></div>
    <div class="mb-2"><label class="form-label">Amount</label><input type="number" name="amount" class="form-control" step="0.01" min="0.01" value="{{ expense.amount if expense else '' }}" required></div>
    <div class="mb-2"><label class="form-label">Vendor</label><input type="text" name="vendor" class="form-control" value="{{ expense.vendor if expense else '' }}"></div>
    <div class="mb-2"><label class="form-label">Payment Method</label>
        <select name="payment_method" class="form-select">
            <option value="Cash" {{ 'selected' if expense and expense.payment_method=='Cash' }}>Cash</option>
            <option value="Card" {{ 'selected' if expense and expense.payment_method=='Card' }}>Card</option>
            <option value="Bank Transfer" {{ 'selected' if expense and expense.payment_method=='Bank Transfer' }}>Bank Transfer</option>
        </select></div>
    <div class="mb-2"><label class="form-label">Receipt Reference</label><input type="text" name="receipt_ref" class="form-control" value="{{ expense.receipt_ref if expense else '' }}"></div>
    <div class="mb-2"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ expense.notes if expense else '' }}</textarea></div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('expenses') }}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
