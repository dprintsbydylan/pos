{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}
{% block page_title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-2"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ customer.name if customer else '' }}" required></div>
            <div class="mb-2"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}"></div>
            <div class="mb-2"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}"></div>
            <div class="mb-2"><label class="form-label">Company</label><input type="text" name="company" class="form-control" value="{{ customer.company if customer else '' }}"></div>
            <div class="mb-2"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea></div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('customers') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
